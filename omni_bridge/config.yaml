name: Omni 10 Bridge
version: "1.2.0"
slug: omni_bridge
description: Volume en afspelen op een Harman Kardon Omni 10, met Music Assistant
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: false
host_network: true
services:
  - mqtt:need
options:
  speaker_ip: 192.168.1.9
  speaker_name: Omni 10
  music_server: ""
  quality: 2.5
schema:
  speaker_ip: str
  speaker_name: str
  music_server: str?
  quality: float(2.2,8)
