name: Omni 10 Bridge
version: "1.6.0"
slug: omni_bridge
description: Volume en afspelen op een Harman Kardon Omni 10, met Music Assistant
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: false
host_network: true
homeassistant_api: true
services:
  - mqtt:need
options:
  speaker_ip: 192.168.1.9
  speaker_name: Omni 10
  music_server: ""
  quality: 2.5
  ma_player: ""
  sync_delay_ms: 2500
  airplay: true
  airplay_offset: -1.5
schema:
  speaker_ip: str
  speaker_name: str
  music_server: str?
  quality: float(2.2,8)
  ma_player: str?
  sync_delay_ms: int(0,5000)
  airplay: bool
  airplay_offset: float(-3,0)
