general = {
    name = "@NAME@";
    port = 5100;
    udp_port_base = 6101;
    output_backend = "stdout";
    mdns_backend = "avahi";
    ignore_volume_control = "yes";
    audio_backend_latency_offset_in_seconds = @OFFSET@;
};

sessioncontrol = {
    allow_session_interruption = "yes";
    session_timeout = 60;
};

metadata = {
    enabled = "yes";
    include_cover_art = "no";
    pipe_name = "/tmp/shairport-sync-metadata";
};
